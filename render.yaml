databases:
  - name: trafos-db
    databaseName: sistema_datos
    user: admin
    plan: free

services:
  - type: web
    name: trafos-web
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trafos-db
          property: connectionString
      - key: PDF_FOLDER
        value: "/data/pdfs"
    # Opcional: Disk persistente (requiere plan de pago en Render) para que los PDFs no se borren en reinicios.
    # disk:
    #   name: pdf-storage
    #   mountPath: /data/pdfs
    #   sizeGB: 1
