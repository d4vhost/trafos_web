version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: sistema_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password_seguro
      POSTGRES_DB: sistema_datos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sistema_datos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    container_name: sistema_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password_seguro@db:5432/sistema_datos
      - PDF_FOLDER=/data/pdfs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./pdfs_incidencias:/data/pdfs

volumes:
  postgres_data: